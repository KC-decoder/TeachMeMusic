[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teachmemusic"
version = "0.0.0"
description = "Transform sheet music into a structured, interactive learning experience."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
authors = [{ name = "TeachMeMusic Contributors" }]
keywords = ["music", "music-education", "sheet-music", "pedagogy", "piano"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    # ADR-0005: contained XML/XSD/Schematron boundary. Exact pin verified by
    # DEV-004 Task 7C before user-score parsing begins.
    "lxml==6.1.3",
    # ADR-0006 / DEV-005 Task 5C: loopback-only local application boundary.
    "fastapi==0.141.1",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[project.scripts]
teachmemusic-local = "teachmemusic.app.server:main"

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "lxml-stubs==0.5.1",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    # DEV-004 Task 7I: official MusicXML rules are compiled as XPath/XSLT 3.
    "saxonche==12.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"teachmemusic.score.musicxml" = [
    "resources/*.json",
    "resources/*.md",
    "resources/*/schema/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "SIM", # flake8-simplify
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
